name: Deploy TeamUp to Azure App Service
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teamup-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable image
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          test -n "$ACR_NAME"
          test -n "$ACR_LOGIN_SERVER"
          az acr login --name "$ACR_NAME"
          docker build --tag "$ACR_LOGIN_SERVER/teamup:$IMAGE_TAG" .
          docker push "$ACR_LOGIN_SERVER/teamup:$IMAGE_TAG"
      - name: Deploy container to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/teamup:${{ github.sha }}
      - name: Verify application readiness
        env:
          APP_ORIGIN: ${{ vars.TEAMUP_APP_ORIGIN }}
        run: |
          test -n "$APP_ORIGIN"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --max-time 15 "$APP_ORIGIN/health/ready"
