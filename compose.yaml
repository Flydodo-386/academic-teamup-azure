# Local PostgreSQL only. The web app is run via npm start outside the container.
# Production uses Azure Database for PostgreSQL, not this local container.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: teamup
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - teamup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamup -d teamup"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  teamup-postgres:
